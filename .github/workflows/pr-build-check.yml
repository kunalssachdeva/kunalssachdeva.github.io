# Validates that the site builds on every pull request to main. The deploy
# workflow (hugo.yml) only runs on push to main, so before this nothing caught
# a broken build until it had already merged and shipped. This job mirrors that
# build (same pinned Hugo, same flags) but uploads nothing and does not deploy.
name: PR build check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "pr-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://kunalssachdeva.github.io/"
