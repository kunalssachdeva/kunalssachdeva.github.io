<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- 10-K circle (gray) -->
  <circle cx="160" cy="115" r="65" fill="#94a3b8" opacity="0.25" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#4a4a4a">10-K</text>

  <!-- ESG circle (navy) -->
  <circle cx="240" cy="115" r="65" fill="#00274C" opacity="0.18" stroke="#00274C" stroke-width="1.5"/>
  <text x="290" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#00274C">ESG report</text>

  <!-- Intersection callout (gold lens marker) -->
  <ellipse cx="200" cy="115" rx="22" ry="55" fill="#FFCB05" opacity="0.55"/>
  <text x="200" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#00274C">Unique</text>
  <text x="200" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#00274C">material</text>

  <text x="200" y="220" text-anchor="middle" font-size="12" fill="#4a4a4a">ESG reports add information beyond 10-K filings</text>
  <text x="200" y="237" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">linked to lower downside risk</text>
</svg>
