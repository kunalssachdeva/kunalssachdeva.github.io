<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Baseline -->
  <line x1="80" y1="185" x2="320" y2="185" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Female-inventor bar -->
  <rect x="110" y="115" width="60" height="70" fill="#00274C" opacity="0.28"/>
  <text x="140" y="205" text-anchor="middle" font-size="11" fill="#64748b">Female-invented</text>

  <!-- Male-equivalent bar -->
  <rect x="230" y="93" width="60" height="92" fill="#00274C"/>
  <text x="260" y="205" text-anchor="middle" font-size="11" fill="#64748b">Male equivalent</text>

  <!-- Gap callout -->
  <path d="M170 105 L230 105" stroke="#FFCB05" stroke-width="2"/>
  <path d="M170 100 L170 110 M230 100 L230 110" stroke="#FFCB05" stroke-width="2"/>
  <text x="200" y="85" text-anchor="middle" font-size="22" font-weight="600" fill="#00274C">+12%</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Citation gap between otherwise equivalent patents</text>
</svg>
