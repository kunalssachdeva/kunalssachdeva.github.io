<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Donut: track -->
  <circle cx="200" cy="115" r="62" fill="none" stroke="#e5e7eb" stroke-width="20"/>
  <!-- Donut: 60% arc (216 degrees), starting at top, clockwise -->
  <circle cx="200" cy="115" r="62" fill="none" stroke="#00274C" stroke-width="20"
          stroke-dasharray="233.6 155.7" stroke-dashoffset="0"
          transform="rotate(-90 200 115)"/>

  <!-- Center stat -->
  <text x="200" y="108" text-anchor="middle" font-size="30" font-weight="600" fill="#00274C">60%</text>
  <text x="200" y="128" text-anchor="middle" font-size="10" fill="#64748b">restated</text>

  <text x="200" y="215" text-anchor="middle" font-size="12" fill="#4a4a4a">Understatements outweigh overstatements 2 to 1</text>
  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">276 of the largest U.S. corporations</text>
</svg>
