<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Axes -->
  <line x1="70" y1="190" x2="340" y2="190" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="70" y1="50" x2="70" y2="190" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Subtle gridlines -->
  <line x1="70" y1="150" x2="340" y2="150" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="70" y1="110" x2="340" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="70" y1="70" x2="340" y2="70" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Trend line -->
  <line x1="80" y1="170" x2="330" y2="65" stroke="#FFCB05" stroke-width="2.5"/>

  <!-- Data points -->
  <circle cx="95" cy="172" r="5" fill="#00274C" opacity="0.45"/>
  <circle cx="135" cy="155" r="5" fill="#00274C" opacity="0.55"/>
  <circle cx="175" cy="135" r="5" fill="#00274C" opacity="0.65"/>
  <circle cx="215" cy="115" r="5" fill="#00274C" opacity="0.75"/>
  <circle cx="255" cy="95" r="5" fill="#00274C" opacity="0.85"/>
  <circle cx="295" cy="78" r="5" fill="#00274C"/>
  <circle cx="325" cy="68" r="5" fill="#00274C"/>

  <!-- Axis labels -->
  <text x="205" y="212" text-anchor="middle" font-size="11" fill="#64748b">Manager inside investment →</text>
  <text x="58" y="120" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 58 120)">Performance →</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Skin-in-the-game funds outperform</text>
</svg>
