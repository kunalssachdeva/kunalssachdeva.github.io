<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Top label -->
  <text x="200" y="40" text-anchor="middle" font-size="12" fill="#4a4a4a">Effect of higher capital requirements on lending</text>

  <!-- Left panel: weak governance (downward) -->
  <text x="100" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Weak governance</text>
  <line x1="50" y1="170" x2="150" y2="170" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="50" y1="90" x2="50" y2="170" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="55" y1="100" x2="145" y2="155" stroke="#00274C" stroke-width="2.5"/>
  <polygon points="145,155 138,150 137,158" fill="#00274C"/>
  <text x="100" y="200" text-anchor="middle" font-size="11" fill="#00274C">↓ Lending</text>

  <!-- Right panel: strong governance (upward) -->
  <text x="300" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Strong governance</text>
  <line x1="250" y1="170" x2="350" y2="170" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="250" y1="90" x2="250" y2="170" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="255" y1="155" x2="345" y2="100" stroke="#00274C" stroke-width="2.5"/>
  <polygon points="345,100 338,102 339,109" fill="#00274C"/>
  <text x="300" y="200" text-anchor="middle" font-size="11" fill="#00274C">↑ Lending</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Same regulation, opposite effects by governance regime</text>
</svg>
