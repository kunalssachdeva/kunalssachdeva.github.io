<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Regulation input -->
  <text x="14" y="135" font-size="11" fill="#64748b">Regulation</text>
  <line x1="78" y1="130" x2="135" y2="130" stroke="#00274C" stroke-width="2"/>
  <polygon points="135,130 128,126 128,134" fill="#00274C"/>

  <!-- The "box" (firm) -->
  <rect x="140" y="80" width="120" height="100" fill="none" stroke="#00274C" stroke-width="2"/>
  <line x1="140" y1="80" x2="200" y2="60" stroke="#00274C" stroke-width="2"/>
  <line x1="260" y1="80" x2="200" y2="60" stroke="#00274C" stroke-width="2"/>
  <line x1="140" y1="80" x2="260" y2="80" stroke="#00274C" stroke-width="2" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="200" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#00274C">Firm</text>

  <!-- Output arrows -->
  <line x1="265" y1="100" x2="295" y2="92" stroke="#00274C" stroke-width="1.5"/>
  <polygon points="295,92 287,90 288,97" fill="#00274C"/>
  <text x="302" y="95" font-size="10" fill="#4a4a4a">Outsource power</text>

  <line x1="265" y1="130" x2="295" y2="130" stroke="#00274C" stroke-width="1.5"/>
  <polygon points="295,130 288,126 288,134" fill="#00274C"/>
  <text x="302" y="133" font-size="10" fill="#4a4a4a">Shift product mix</text>

  <line x1="265" y1="160" x2="295" y2="168" stroke="#FFCB05" stroke-width="1.5"/>
  <polygon points="295,168 288,163 287,170" fill="#FFCB05"/>
  <text x="302" y="171" font-size="10" fill="#4a4a4a">Less variety</text>

  <text x="200" y="220" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Opening the brown box of production responses</text>
</svg>
