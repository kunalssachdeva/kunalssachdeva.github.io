  <circle cx="232" cy="84" r="6" fill="#00274C"/>
  <text x="104" y="70" text-anchor="middle" font-size="12" fill="#666666">Expected</text>
  <text x="232" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="#00274C">Actual</text>
