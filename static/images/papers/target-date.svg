<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Timeline -->
  <line x1="60" y1="120" x2="340" y2="120" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Expected -->
  <circle cx="140" cy="120" r="7" fill="#94a3b8"/>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#64748b">Expected</text>
  <text x="140" y="145" text-anchor="middle" font-size="10" fill="#94a3b8">retirement</text>

  <!-- Actual -->
  <circle cx="280" cy="120" r="8" fill="#00274C"/>
  <text x="280" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#00274C">Actual</text>
  <text x="280" y="145" text-anchor="middle" font-size="10" fill="#00274C">retirement</text>

  <!-- Gap callout -->
  <line x1="150" y1="120" x2="270" y2="120" stroke="#FFCB05" stroke-width="3"/>
  <text x="210" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#00274C">+4.8 yrs</text>

  <!-- Wealth loss -->
  <text x="200" y="195" text-anchor="middle" font-size="20" font-weight="600" fill="#00274C">−4% wealth at retirement</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Misjudged labor-force exit costs target-date fund holders</text>
</svg>
