<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Gridlines -->
  <line x1="80" y1="185" x2="320" y2="185" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="145" x2="320" y2="145" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="80" y1="105" x2="320" y2="105" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Before -->
  <rect x="110" y="85" width="60" height="100" fill="#00274C" opacity="0.28"/>
  <text x="140" y="205" text-anchor="middle" font-size="11" fill="#64748b">Before</text>

  <!-- After -->
  <rect x="230" y="98" width="60" height="87" fill="#00274C"/>
  <text x="260" y="205" text-anchor="middle" font-size="11" fill="#64748b">After</text>

  <!-- Reduction callout -->
  <path d="M170 92 L230 105" stroke="#FFCB05" stroke-width="2"/>
  <text x="200" y="72" text-anchor="middle" font-size="22" font-weight="600" fill="#00274C">−13%</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Toxic chemical releases at targeted firms</text>
</svg>
