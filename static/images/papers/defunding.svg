<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Label -->
  <text x="200" y="55" text-anchor="middle" font-size="12" fill="#4a4a4a">Total firm credit before vs. after intervention</text>

  <!-- Before bar -->
  <text x="80" y="100" font-size="11" fill="#64748b">Before</text>
  <rect x="80" y="108" width="240" height="22" fill="#00274C"/>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#ffffff">Targeted bank credit</text>

  <!-- After bar (same total, split) -->
  <text x="80" y="155" font-size="11" fill="#64748b">After</text>
  <rect x="80" y="163" width="60" height="22" fill="#00274C" opacity="0.28"/>
  <rect x="140" y="163" width="180" height="22" fill="#00274C"/>
  <text x="230" y="179" text-anchor="middle" font-size="11" fill="#ffffff">Substitution via non-targeted banks</text>

  <!-- Total equality marker -->
  <line x1="320" y1="108" x2="328" y2="108" stroke="#FFCB05" stroke-width="2"/>
  <line x1="320" y1="185" x2="328" y2="185" stroke="#FFCB05" stroke-width="2"/>
  <line x1="328" y1="108" x2="328" y2="185" stroke="#FFCB05" stroke-width="2"/>
  <text x="345" y="150" font-size="14" font-weight="600" fill="#00274C">=</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Full credit substitution — no change in total debt</text>
</svg>
