<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Fulcrum -->
  <polygon points="200,150 188,175 212,175" fill="#94a3b8"/>
  <line x1="180" y1="178" x2="220" y2="178" stroke="#94a3b8" stroke-width="2"/>

  <!-- Tilted beam (returns side down) -->
  <line x1="80" y1="160" x2="320" y2="120" stroke="#00274C" stroke-width="3" stroke-linecap="round"/>

  <!-- Left pan: Returns (heavier, lower) -->
  <line x1="100" y1="162" x2="100" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="65" y="180" width="70" height="32" fill="#00274C"/>
  <text x="100" y="201" text-anchor="middle" font-size="11" fill="#ffffff">Returns</text>

  <!-- Right pan: E&S (lighter, higher) -->
  <line x1="300" y1="122" x2="300" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="265" y="78" width="70" height="22" fill="#00274C" opacity="0.28"/>
  <text x="300" y="93" text-anchor="middle" font-size="11" fill="#00274C">E&amp;S goals</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">When outcomes are uncertain, ESG funds tilt to returns</text>
</svg>
