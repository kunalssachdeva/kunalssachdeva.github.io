<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Inter, -apple-system, system-ui, sans-serif">
  <text x="160.0" y="20" text-anchor="middle" font-size="11" fill="#666666">Survival with and without access to wealth</text>
  <line x1="74" y1="44" x2="74" y2="140" stroke="#D8DDE3" stroke-width="1"/>
<line x1="74" y1="140" x2="272" y2="140" stroke="#D8DDE3" stroke-width="1"/>
<path d="M74 52 C 140 58, 200 74, 268 104" fill="none" stroke="#00274C" stroke-width="2.5" stroke-linecap="round"/>
<path d="M74 52 C 130 74, 190 112, 268 136" fill="none" stroke="#7A93AC"
      stroke-width="2.5" stroke-dasharray="5,4" stroke-linecap="round"/>
<!-- Labels sit in the gap between the curves, not on them. At t=0.5 the solid
     curve is at (170,69) and the dashed at (163,93), so 62 and 108 clear both. -->
<text x="176" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#00274C">With access</text>
<text x="150" y="116" text-anchor="middle" font-size="11" fill="#7A93AC">Without</text>
<text x="66" y="94.0" text-anchor="middle" font-size="11" fill="#4a4a4a"
      transform="rotate(-90 66 94.0)">Survival</text>
<text x="171.0" y="158" text-anchor="middle" font-size="11" fill="#4a4a4a">Time →</text>
  <text x="160.0" y="186" text-anchor="middle" font-size="11" fill="#666666">Wealth in poor health states raises survival</text>
  
</svg>
