<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="400" height="250" fill="#f8fafc"/>

  <!-- Axes -->
  <line x1="70" y1="190" x2="340" y2="190" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="70" y1="50" x2="70" y2="190" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Subtle gridlines -->
  <line x1="70" y1="150" x2="340" y2="150" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="70" y1="110" x2="340" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="70" y1="70" x2="340" y2="70" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- Without access (lower curve, gray) -->
  <path d="M75 70 Q160 100 230 135 T335 178" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="335" y="170" text-anchor="end" font-size="10" fill="#94a3b8">Without access</text>

  <!-- With access (upper curve, navy) -->
  <path d="M75 70 Q160 80 230 92 T335 110" fill="none" stroke="#00274C" stroke-width="2.5"/>
  <text x="335" y="102" text-anchor="end" font-size="10" font-weight="600" fill="#00274C">With life-settlement access</text>

  <!-- Axis labels -->
  <text x="205" y="212" text-anchor="middle" font-size="11" fill="#64748b">Time →</text>
  <text x="58" y="120" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 58 120)">Survival probability</text>

  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Wealth access in poor health raises survival</text>
</svg>
