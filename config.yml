params:
    description: "Kunal Sachdeva - Assistant Professor of Finance at University of Michigan Ross School of Business. Research on climate finance, environmental regulation, and financial intermediation."
    author: Kunal Sachdeva
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["research"]
    ShowToc: false
    disableScrollToTop: false
    TocOpen: false
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    # math: set per-page in front matter when a page needs it. Site-wide it pulled
    # 79KB of render-blocking KaTeX from a CDN onto every page, and no page has math.

    profileMode:
          enabled: true
          title: Kunal Sachdeva
          subtitle: |
            Kunal Sachdeva studies how firms and financial markets respond to environmental regulation and climate risk — and whether those responses are real. Recent work asks whether shareholder campaigns actually cut pollution, whether large corporations report emissions accurately, and how credit and governance shape firm behavior.

            His research is published or forthcoming in the *Journal of Financial Economics*, the *Review of Financial Studies*, *Management Science*, and *Nature Climate Change*, and has been recognized with the [Moskowitz Prize](https://www.kellogg.northwestern.edu/academics-research/social-impact-sustainability/moskowitz-prize/) for socially responsible investing research and the Arnold M. and Linda T. Jacob Faculty Fellow Award.

            He is an [Assistant Professor of Finance](https://michiganross.umich.edu/faculty-research/faculty/kunal-sachdeva) and the Michael R. and Mary Kay Hallman Faculty Fellow at the [Stephen M. Ross School of Business](https://michiganross.umich.edu/) at the [University of Michigan](https://umich.edu/), a faculty affiliate of the [Erb Institute](https://erb.umich.edu/), and was previously on the finance faculty at Rice. His PhD in Finance is from [Columbia Business School](https://business.columbia.edu/).
          imageUrl: "profile.jpg"
          imageTitle: "Kunal Sachdeva"
          imageWidth: 280
          imageHeight: 280
          # Two, not five. The nav above already carries all five destinations in
          # the same viewport, so a five-button row repeated them verbatim and
          # added weight without adding information. These are the two highest
          # intent for a first-time visitor.
          buttons:
            - name: Research
              url: research/
            - name: CV
              url: cv.pdf

    # JSON-LD identity. Without publisherType the theme declares the homepage an
