    comments: false
    # math: set per-page in front matter when a page needs it. Site-wide it pulled
    # 79KB of render-blocking KaTeX from a CDN onto every page, and no page has math.

    profileMode:
          enabled: true
          title: Kunal Sachdeva
          subtitle: |
            Kunal Sachdeva is an [Assistant Professor of Finance](https://michiganross.umich.edu/faculty-research/faculty/kunal-sachdeva) and the Michael R. and Mary Kay Hallman Faculty Fellow at the [Stephen M. Ross School of Business](https://michiganross.umich.edu/) at the [University of Michigan](https://umich.edu/). He is also a faculty affiliate of the [Erb Institute](https://erb.umich.edu/) and received his PhD in Finance from [Columbia Business School](https://business.columbia.edu/).

            His research studies the real effects of financial markets, with a focus on climate finance, environmental regulation, and financial intermediation. Recent work examines responses to environmental risk and regulatory change, as well as the role of financial markets in the transition to a more sustainable economy. His research has been published in the *Journal of Financial Economics*, *Management Science*, and *Nature Climate Change*, and has been recognized with the [Moskowitz Prize](https://www.kellogg.northwestern.edu/academics-research/social-impact-sustainability/moskowitz-prize/) for socially responsible investing research and the Arnold M. and Linda T. Jacob Faculty Fellow Award.
          imageUrl: "profile.jpg"
          imageTitle: "Kunal Sachdeva"
          imageWidth: 280
          imageHeight: 280
          buttons:
            - name: Research
              url: research/
            - name: Discussions
              url: discussions/
            - name: Code & Data
              url: data/
            - name: CV
              url: cv.pdf
